openapi: 3.1.0
info:
  title: Q-Harness Local Service
  version: 0.1.0
  description: >-
    Loopback-only MVP contract. All operations require a local bearer token and
    explicit Project scope. Business rules are shared with the CLI and MCP adapters.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "8765"
security:
  - localBearer: []
tags:
  - name: Projects
  - name: Knowledge
  - name: Tasks
  - name: Reports

paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Authenticated local dependency health
          content:
            application/json:
              schema:
                type: object
                required: [status, database, worker, correlation_id]
                properties:
                  status: {enum: [ok, degraded]}
                  database: {enum: [ok, unavailable]}
                  worker: {enum: [ok, stale, unavailable]}
                  correlation_id: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      responses:
        "200":
          description: Registered Projects
          content:
            application/json:
              schema:
                type: object
                required: [items, correlation_id]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Project"}
                  correlation_id: {type: string}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [Projects]
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, workspace_root]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                stable_key: {type: string, pattern: "^[a-z][a-z0-9-]{1,63}$"}
                workspace_root: {type: string, minLength: 1}
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project_id}/repositories:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Projects]
      operationId: addRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path, role]
              properties:
                path: {type: string, minLength: 1}
                name: {type: string, minLength: 1, maxLength: 120}
                role: {type: string, minLength: 1, maxLength: 64}
                access_mode: {enum: [READ_ONLY, READ_WRITE], default: READ_WRITE}
      responses:
        "201":
          description: Repository registered
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Repository"}
        "409":
          description: Canonical path already owned or name conflict
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project_id}/status:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      operationId: getProjectStatus
      responses:
        "200":
          description: Project, repository and freshness status
          content:
            application/json:
              schema:
                type: object
                required: [project, repositories, blocked_task_count, correlation_id]
                properties:
                  project: {$ref: "#/components/schemas/Project"}
                  repositories:
                    type: array
                    items: {$ref: "#/components/schemas/Repository"}
                  blocked_task_count: {type: integer, minimum: 0}
                  correlation_id: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project_id}/index-jobs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Knowledge]
      operationId: createIndexJob
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mode: {enum: [incremental, full], default: incremental}
                repository_ids:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items: {type: string, format: uuid}
      responses:
        "202":
          description: Index job accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobAccepted"}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project_id}/knowledge/search:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Knowledge]
      operationId: searchKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KnowledgeSearchRequest"}
      responses:
        "200":
          description: Fresh, Project-scoped search results
          content:
            application/json:
              schema:
                type: object
                required: [freshness_checked_at, items, correlation_id]
                properties:
                  freshness_checked_at: {type: string, format: date-time}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/KnowledgeResult"}
                  correlation_id: {type: string}
        "409":
          description: Index is stale and refresh could not complete
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project_id}/ask:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Knowledge]
      operationId: askProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question: {type: string, minLength: 1, maxLength: 10000}
      responses:
        "200":
          description: Concise read-only answer with citations
          content:
            application/json:
              schema:
                type: object
                required: [answer, citations, correlation_id]
                properties:
                  answer: {type: string}
                  citations:
                    type: array
                    items: {$ref: "#/components/schemas/KnowledgeResult"}
                  correlation_id: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project_id}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Tasks]
      operationId: listTasks
      responses:
        "200":
          description: Project tasks
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [Tasks]
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request]
              properties:
                request: {type: string, minLength: 1, maxLength: 20000}
      responses:
        "201":
          description: Classified task with proposed scope; not yet executing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project_id}/tasks/{task_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      operationId: getTask
      responses:
        "200":
          description: Task with approvals, executions, gates and event summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project_id}/tasks/{task_id}/approvals:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: approveTaskScope
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApprovalScope"}
      responses:
        "201":
          description: Immutable approval decision
          content:
            application/json:
              schema:
                type: object
                required: [approval_id, status, scope_hash]
                properties:
                  approval_id: {type: string, format: uuid}
                  status: {const: APPROVED}
                  scope_hash: {type: string}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project_id}/tasks/{task_id}/executions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Tasks]
      operationId: createExecution
      responses:
        "202":
          description: Approved execution queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobAccepted"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project_id}/tasks/{task_id}/actions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: actOnTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: {enum: [cancel, continue]}
                decision: {type: string, maxLength: 1000}
      responses:
        "202":
          description: Cancellation requested or blocked task explicitly continued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project_id}/notifications:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Tasks]
      operationId: listNotifications
      parameters:
        - name: since
          in: query
          schema: {type: integer, minimum: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: Event projection for user-visible notification types
          content:
            application/json:
              schema:
                type: object
                required: [items, correlation_id]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [event_id, event_type, occurred_at]
                      properties:
                        event_id: {type: integer}
                        event_type:
                          enum: [SPEC_READY, APPROVAL_REQUIRED, TASK_BLOCKED, TEST_FAILED, TASK_COMPLETED, REPORT_READY]
                        task_id: {type: [string, "null"], format: uuid}
                        report_id: {type: [string, "null"], format: uuid}
                        occurred_at: {type: string, format: date-time}
                        summary: {type: string}
                  correlation_id: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project_id}/report-templates:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Reports]
      operationId: listReportTemplates
      responses:
        "200":
          description: Effective registered templates
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ReportTemplate"}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project_id}/reports:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Reports]
      operationId: generateReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [template_id]
              properties:
                template_id: {type: string, pattern: "^[a-z][a-z0-9-]{1,63}$"}
                version: {type: string}
                scope: {type: object, maxProperties: 10}
      responses:
        "202":
          description: Report generation accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Report"}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project_id}/reports/{report_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: report_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Reports]
      operationId: getReport
      responses:
        "200":
          description: Report state and validated artifact metadata
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Report"}
        default: {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    localBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-local-token

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TaskId:
      name: task_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}

  responses:
    Error:
      description: Request failed
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}

  schemas:
    Project:
      type: object
      required: [id, stable_key, name, workspace_root, status, version]
      properties:
        id: {type: string, format: uuid}
        stable_key: {type: string}
        name: {type: string}
        workspace_root: {type: string}
        status: {enum: [ACTIVE, UNAVAILABLE]}
        version: {type: integer, minimum: 1}

    Repository:
      type: object
      required: [id, project_id, name, role, canonical_path, access_mode, status]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        name: {type: string}
        role: {type: string}
        canonical_path: {type: string}
        branch_name: {type: [string, "null"]}
        head_sha: {type: [string, "null"]}
        access_mode: {enum: [READ_ONLY, READ_WRITE]}
        status: {enum: [READY, MISSING, DENIED, NOT_GIT]}
        index_status: {enum: [UNINDEXED, INDEXING, FRESH, STALE, FAILED]}

    KnowledgeSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 1000}
        repository_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {type: string, format: uuid}
        limit: {type: integer, minimum: 1, maximum: 50, default: 10}

    KnowledgeResult:
      type: object
      required: [repository_id, relative_path, start_line, end_line, excerpt, content_hash, index_status]
      properties:
        repository_id: {type: string, format: uuid}
        relative_path: {type: string}
        start_line: {type: integer, minimum: 1}
        end_line: {type: integer, minimum: 1}
        symbol: {type: [string, "null"]}
        excerpt: {type: string}
        content_hash: {type: string}
        branch_name: {type: [string, "null"]}
        commit_sha: {type: [string, "null"]}
        index_status: {enum: [FRESH, STALE]}

    Task:
      type: object
      required: [id, project_id, display_id, title, status, version]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        display_id: {type: string}
        title: {type: string}
        status:
          enum: [CREATED, ANALYZING, WAITING_APPROVAL, PLANNING, IMPLEMENTING, TESTING, REVIEWING, BLOCKED, FAILED, COMPLETED, CANCELLED]
        classification: {type: object}
        proposed_scope: {$ref: "#/components/schemas/ApprovalScope"}
        required_gates:
          type: array
          items: {type: object}
        version: {type: integer, minimum: 1}

    ApprovalScope:
      type: object
      additionalProperties: false
      required: [repository_paths, tools, commands, network, credential_names, risk_ceiling]
      properties:
        repository_paths:
          type: array
          uniqueItems: true
          items: {type: string}
        tools:
          type: array
          uniqueItems: true
          items: {type: string}
        commands:
          type: array
          uniqueItems: true
          items: {type: string}
        network: {type: boolean, default: false}
        credential_names:
          type: array
          uniqueItems: true
          items: {type: string}
        risk_ceiling: {enum: [LOW, MEDIUM, HIGH]}
        required_gates:
          type: array
          maxItems: 100
          description: Operator-approved commands; absent or empty gates prevent completion.
          items:
            type: object
            additionalProperties: false
            required: [name, cwd, command]
            properties:
              name: {type: string, minLength: 1, maxLength: 100}
              cwd: {type: string, minLength: 1, maxLength: 4096}
              command:
                type: array
                minItems: 1
                maxItems: 100
                items: {type: string}
              required: {type: boolean, default: true}

    JobAccepted:
      type: object
      required: [id, status, correlation_id]
      properties:
        id: {type: string, format: uuid}
        status: {enum: [QUEUED, PENDING]}
        correlation_id: {type: string}

    ReportTemplate:
      type: object
      required: [template_id, version, scope, output_format, checksum, status]
      properties:
        template_id: {type: string}
        version: {type: string}
        scope: {enum: [project, platform]}
        output_format: {enum: [DOCX, XLSX]}
        language: {type: string}
        checksum: {type: string}
        required_permission: {type: string}
        status: {enum: [ACTIVE, INVALID, SUPERSEDED]}

    Report:
      type: object
      required: [id, project_id, template_id, template_version, state]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        template_id: {type: string}
        template_version: {type: string}
        state: {enum: [PENDING, GENERATING, READY, VIEWED, FAILED]}
        artifact:
          oneOf:
            - type: "null"
            - type: object
              required: [path, media_type, sha256, size_bytes]
              properties:
                path: {type: string}
                media_type: {type: string}
                sha256: {type: string}
                size_bytes: {type: integer, minimum: 0}
        missing_data: {type: array, items: {type: object}}
        data_provenance: {type: array, items: {type: object}}

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlation_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        code: {type: string}
        retryable: {type: boolean, default: false}
        correlation_id: {type: string}
        details: {type: object}

