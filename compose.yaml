services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: qharness
      POSTGRES_USER: qharness
      POSTGRES_PASSWORD: qharness
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qharness -d qharness"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - qharness-postgres:/var/lib/postgresql

volumes:
  qharness-postgres:

